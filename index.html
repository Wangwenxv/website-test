<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>早读音量检测</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="meter-panel" aria-labelledby="appTitle">
        <div class="topbar">
          <div>
            <p class="eyebrow">Morning Reading Monitor</p>
            <h1 id="appTitle">早读音量检测</h1>
          </div>
          <div class="status-pill" id="micStatus">未监听</div>
        </div>

        <div class="readout" aria-live="polite">
          <span id="dbValue">--</span>
          <span class="unit">dB</span>
        </div>

        <div class="level-row">
          <div class="level-label" id="levelLabel">等待麦克风</div>
          <div class="target-label">
            <span id="targetRange">60 - 80 dB</span>
          </div>
        </div>

        <div class="bar-frame" aria-label="当前音量">
          <div class="target-band" id="targetBand"></div>
          <div class="level-bar" id="levelBar"></div>
          <div class="scale-marks">
            <span>30</span>
            <span>50</span>
            <span>70</span>
            <span>90</span>
            <span>110</span>
          </div>
        </div>

        <canvas id="historyCanvas" width="1200" height="260" aria-label="音量曲线"></canvas>
      </section>

      <aside class="side-panel">
        <section class="control-group" aria-label="监听控制">
          <button class="primary-button" id="startButton" type="button">
            <span class="button-icon" aria-hidden="true">▶</span>
            开始监听
          </button>
          <button class="icon-button" id="stopButton" type="button" aria-label="停止监听" title="停止监听" disabled>
            <span aria-hidden="true">■</span>
          </button>
        </section>

        <section class="stats-grid" aria-label="统计">
          <div class="stat">
            <span>平均</span>
            <strong id="avgValue">--</strong>
          </div>
          <div class="stat">
            <span>峰值</span>
            <strong id="peakValue">--</strong>
          </div>
          <div class="stat">
            <span>达标率</span>
            <strong id="passValue">--</strong>
          </div>
          <div class="stat">
            <span>连续</span>
            <strong id="streakValue">--</strong>
          </div>
        </section>

        <section class="settings" aria-label="目标设置">
          <label class="range-control">
            <span>最低目标 <b id="minTargetText">60 dB</b></span>
            <input id="minTarget" type="range" min="35" max="95" value="60" />
          </label>
          <label class="range-control">
            <span>过响提醒 <b id="maxTargetText">80 dB</b></span>
            <input id="maxTarget" type="range" min="50" max="110" value="80" />
          </label>
          <label class="range-control">
            <span>校准偏移 <b id="calibrationText">94 dB</b></span>
            <input id="calibrationOffset" type="range" min="60" max="125" value="94" />
          </label>
        </section>

        <section class="calibration" aria-label="校准">
          <label>
            参考值
            <input id="referenceDb" type="number" min="30" max="120" step="1" value="70" />
          </label>
          <button id="calibrateButton" type="button" disabled>校准到当前</button>
        </section>

        <p class="note" id="note">
          浏览器麦克风只能提供估算分贝，建议用已知分贝声源校准。
        </p>
      </aside>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
