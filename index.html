/**
 * 本文件由 scripts/build-tokens.js 从 references/foundation/design-tokens.json 生成，不要手改。
 * 改色值 / 间距 / 圆角等 → 改 design-tokens.json → 重新跑 `node scripts/build-tokens.js`。
 * 来源: Figma Token Studio export — design-tokens_tokens.json，更新于 2026-05-19
 */
:root {
  /* ── 基础色板 ── */
  --primary-1: #e6f4ff;  /* 浅色/白底悬浮 */
  --primary-2: #c9e6ff;  /* 文字禁用 */
  --primary-3: #9ccdff;  /* 一般禁用 */
  --primary-4: #6eb1ff;  /* 特殊场景 */
  --primary-5: #4093ff;  /* 悬浮 hover */
  --primary-6: #1272ff;  /* 常规 default */
  --primary-7: #0452d9;  /* 点击 active */
  --success-1: #e6ffee;  /* 浅色/白底悬浮 */
  --success-2: #cef5dc;  /* 文字禁用 */
  --success-3: #9ee8bc;  /* 一般禁用 */
  --success-4: #72dca0;  /* 特殊场景 */
  --success-5: #4acf88;  /* 悬浮 hover */
  --success-6: #27c274;  /* 常规 default */
  --success-7: #179c5e;  /* 点击 active */
  --warning-1: #fff7e6;  /* 浅色/白底悬浮 */
  --warning-2: #ffeecc;  /* 文字禁用 */
  --warning-3: #ffdb9e;  /* 一般禁用 */
  --warning-4: #ffc670;  /* 特殊场景 */
  --warning-5: #ffad42;  /* 悬浮 hover */
  --warning-6: #ff9214;  /* 常规 default */
  --warning-7: #d97007;  /* 点击 active */
  --danger-1: #ffece6;  /* 浅色/白底悬浮 */
  --danger-2: #ffdbd1;  /* 文字禁用 */
  --danger-3: #ffb8a8;  /* 一般禁用 */
  --danger-4: #ff9380;  /* 特殊场景 */
  --danger-5: #ff6a57;  /* 悬浮 hover */
  --danger-6: #f43b2c;  /* 常规 default */
  --danger-7: #ce241b;  /* 点击 active */

  /* ── 文字色 ── */
  --color-text-1: #1e252e;  /* 强调/正文标题 */
  --color-text-2: #475468;  /* 次强调/正文标题 */
  --color-text-3: #7588a3;  /* 次要信息 */
  --color-text-4: #b2bdcc;  /* 置灰信息 */
  --color-text-white: #ffffff;  /* 纯白文字 */

  /* ── 背景色 ── */
  --color-bg-white: #ffffff;  /* 纯白填充 */
  --color-bg-1: #ffffff;  /* 特殊深色背景（光线模式下白色） */
  --color-bg-2: #ffffff;  /* 白色页面背景 */
  --color-bg-3: #ffffff;  /* 二级容器背景 */
  --color-bg-4: #ffffff;  /* 悬浮元素 hover */
  --color-bg-5: #f4f5f8;  /* 灰色页面背景 */
  --color-bg-6: rgba(255,255,255,0.6);  /* 透明色背景 */
  --color-bg-7: rgba(255,255,255,0.4);  /* 透明色背景(深) */

  /* ── 描边色 ── */
  --color-border-1: #edeff3;  /* 浅/信息分割线 */
  --color-border-2: #e6e9ee;  /* 一般/容器描边 */
  --color-border-3: #d1d7e1;  /* 深/表单描边 */
  --color-border-4: #b2bdcc;  /* 重/特殊场景 */

  /* ── 填充色 ── */
  --color-fill-1: #f6f8f9;  /* 浅/禁用 */
  --color-fill-2: #f4f5f8;  /* 常规/白底悬浮 */
  --color-fill-3: #e6e9ee;  /* 深/浅灰悬浮 */
  --color-fill-4: #d1d7e1;  /* 重/灰底悬浮 */
  --color-fill-5: #b2bdcc;  /* 重/特殊场景 */

  /* ── 导航专属色 ── */
  --nav-background: #282f3f;  /* 深色导航背景 */
  --nav-sidebar-background: #f6f8f9;  /* 灰色侧导航背景，实测 Figma 使用 color-fill-1（#f6f8f9），原 Token Studio 导出值 #fafbfc 有误 */
  --nav-icon-color: #ffffff99;  /* 深色导航图标颜色（60% 透明度） */
  --nav-text-color: #ffffffcc;  /* 深色导航文字颜色（80% 透明度） */
  --nav-arrow-color: #ffffff80;  /* 深色导航箭头颜色（50% 透明度） */

  /* ── 蒙层 ── */
  --color-overlay: #00000099;  /* 模态弹窗、抽屉的背景蒙层（60% 透明度） */

  /* ── 语义别名（引用基础色板，不要在这里改色值，改 design-tokens.json 里对应的基础色） ── */
  --primary-default: var(--primary-6);
  --primary-hover: var(--primary-5);
  --primary-active: var(--primary-7);
  --primary-disabled: var(--primary-3);
  --primary-bg: var(--primary-1);
  --success-bg: var(--success-1);
  --warning-default: var(--warning-6);
  --warning-hover: var(--warning-5);
  --warning-active: var(--warning-7);
  --warning-bg: var(--warning-1);
  --text-primary: var(--color-text-1);
  --text-secondary: var(--color-text-2);
  --text-tertiary: var(--color-text-3);
  --text-disabled: var(--color-text-4);
  --text-inverse: var(--color-text-white);
  --border-light: var(--color-border-1);
  --border-heavy: var(--color-border-4);
  --fill-disabled: var(--color-fill-1);
  --fill-default: var(--color-fill-2);
  --fill-hover: var(--color-fill-3);
  --fill-active: var(--color-fill-4);
  --fill-heavy: var(--color-fill-5);
  --bg-overlay-light: var(--color-bg-6);
  --bg-overlay-deep: var(--color-bg-7);
  --warning-disabled: var(--warning-3);
  --success-disabled: var(--success-3);
  --danger-bg: var(--danger-1);
  --danger-disabled: var(--danger-3);
  --danger-hover: var(--danger-5);
  --danger-default: var(--danger-6);
  --danger-active: var(--danger-7);

  /* ── 字体 ── */
  --font-family-cn: "PingFang SC", "Noto Sans SC", sans-serif;
  --font-family-en: "Arial", sans-serif;
  --font-family-number: "Helvetica Neue", "Arial", sans-serif;
  --font-family-mono: "Geist Mono", "JetBrains Mono", monospace;

  /* ── 字号 / 行高 / 字重（slug 对照见 scripts/build-tokens.js 的 FONT_SIZE_SLUGS） ── */
  --font-size-auxiliary-12: 12px;  /* 辅助-12 */
  --line-height-auxiliary-12: 20px;
  --font-weight-auxiliary-12-regular: 400;
  --font-weight-auxiliary-12-medium: 500;
  --font-size-body-14: 14px;  /* 正文-14 */
  --line-height-body-14: 22px;
  --font-weight-body-14-regular: 400;
  --font-weight-body-14-medium: 500;
  --font-size-title-16: 16px;  /* 标题-16 */
  --line-height-title-16: 24px;
  --font-weight-title-16-regular: 400;
  --font-weight-title-16-medium: 500;
  --font-size-title-18: 18px;  /* 标题-18 */
  --line-height-title-18: 26px;
  --font-weight-title-18-regular: 400;
  --font-weight-title-18-medium: 500;
  --font-size-title-20: 20px;  /* 标题-20 */
  --line-height-title-20: 28px;
  --font-weight-title-20-regular: 400;
  --font-weight-title-20-medium: 500;
  --font-size-title-24: 24px;  /* 标题-24 */
  --line-height-title-24: 32px;
  --font-weight-title-24-regular: 400;
  --font-weight-title-24-medium: 500;
  --font-size-display-32: 32px;  /* 运营-32 */
  --line-height-display-32: 36px;
  --font-weight-display-32-regular: 400;
  --font-weight-display-32-medium: 500;
  --font-size-display-36: 36px;  /* 运营-36 */
  --line-height-display-36: 44px;
  --font-weight-display-36-regular: 400;
  --font-weight-display-36-medium: 500;
  --font-size-display-48: 48px;  /* 运营-48 */
  --line-height-display-48: 56px;
  --font-weight-display-48-regular: 400;
  --font-weight-display-48-medium: 500;

  /* ── 间距 ── */
  --spacing-1: 4px;
  --spacing-2: 8px;
  --spacing-3: 12px;
  --spacing-4: 16px;
  --spacing-5: 20px;
  --spacing-6: 24px;
  --spacing-8: 32px;
  --spacing-10: 40px;
  --spacing-12: 48px;
  --spacing-16: 64px;
  --spacing-24: 96px;

  /* ── 圆角 ── */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-xl: 16px;
  --radius-full: 9999px;

  /* ── 阴影 ── */
  --shadow-sm: 0 1px 2px rgba(0,0,0,.06);
  --shadow-md: 0 4px 12px rgba(0,0,0,.08);
  --shadow-lg: 0 8px 24px rgba(0,0,0,.12);
  --shadow-xl: 0 16px 40px rgba(0,0,0,.16);

  /* ── 断点（仅供 JS/文档引用，@media 查询里不能用 CSS 变量，需手写同值像素） ── */
  --breakpoint-sm: 640px;
  --breakpoint-md: 768px;
  --breakpoint-lg: 1024px;
  --breakpoint-xl: 1280px;
  --breakpoint-2xl: 1536px;

  /* ── 层级 ── */
  --z-navbar: 1000;
  --z-dropdown: 900;
  --z-modal: 800;
  --z-toast: 700;

  /* ── 过渡 ── */
  --transition-instant: 100ms ease-out;
  --transition-fast: 150ms ease-in-out;
  --transition-standard: 200ms ease-out;
  --transition-medium: 300ms cubic-bezier(.4,0,.2,1);
  --transition-slow: 500ms ease-in-out;
}

'use strict';
let S, actor='hq',view='warehouses',tab='balance',search='',pageIndex=1,uid=2000,keyFilter=null,transferContext=null,lastTransferHint=null;
const softwareOptions=['Office','CAD','终端安全'];
const typeLabel=t=>t==='single'?'单设备密钥':'多设备密钥';
const now=()=>new Date().toLocaleString('sv-SE',{timeZone:'Asia/Shanghai'});
const nextId=p=>p+'-'+(++uid);
const warehouse=id=>S.warehouses.find(o=>o.id===id), key=id=>S.keys.find(k=>k.id===id), lot=id=>S.lots.find(l=>l.id===id),device=id=>S.devices.find(d=>d.id===id);
function seed(){
 if(S?.attachments)S.attachments.forEach(a=>URL.revokeObjectURL(a.url));
 uid=2000;
 S={warehouses:[{id:'hq',name:'总机构',parent:null,status:'active',manager:'总机构管理员'},{id:'east',name:'华东分机构',parent:'hq',status:'active',manager:'华东管理员'},{id:'site',name:'上海分机构',parent:'hq',status:'active',manager:'上海管理员'},{id:'south',name:'华南分机构',parent:'hq',status:'active',manager:'华南管理员'}],keys:[],lots:[],bindings:[],installs:[],transfers:[],audit:[],devices:[]};
 for(let i=1;i<=40;i++)S.devices.push({id:'PC-'+String(i).padStart(3,'0'),name:['办公笔记本','研发工作站','设计电脑'][(i-1)%3],warehouse:['hq','east','site','south'][Math.floor((i-1)/10)],status:i===39?'inactive':i===40?'deleted':'active'});
 function add(id,code,software,type,max,date){S.keys.push({id,code,name:software+'许可',software,type,max,serial:'DEMO-'+code,date,created:S.keys.length+1,createdWarehouse:'hq',deleted:false});S.lots.push({id:'L-'+id,key:id,warehouse:'hq',qty:max,parent:null});}
 add('K1','OFF-M-030','Office','multi',30,'2025-01-01');add('K2','OFF-M-020','Office','multi',20,'2027-12-31');add('K3','OFF-M-015','Office','multi',15,'');
 add('C1','CAD-M-010','CAD','multi',10,'2025-10-01');
 for(let i=1;i<=25;i++)add('S'+i,'OFF-S-'+String(i).padStart(3,'0'),'Office','single',1,'');
 lot('L-K1').qty=20;S.lots.push({id:'L-east',key:'K1',warehouse:'east',qty:8,parent:'L-K1'},{id:'L-site',key:'K1',warehouse:'site',qty:2,parent:'L-east'});
 S.transfers=[{id:'TR-SEED-1',from:'hq',to:'east',direction:'down',software:'Office',type:'multi',qty:10,items:[{lot:'L-K1',key:'K1',qty:10}],status:'accepted',created:'2026-11-01 09:00:00',finished:'2026-11-01 09:10:00',reason:'',operator:'总机构管理员'}, {id:'TR-SEED-2',from:'east',to:'site',direction:'down',software:'Office',type:'multi',qty:2,items:[{lot:'L-east',key:'K1',qty:2}],status:'accepted',created:'2026-11-01 10:00:00',finished:'2026-11-01 10:10:00',reason:'',operator:'华东管理员'}];
 S.transfers.unshift({id:'TR-DEMO-IN-HQ',from:'east',to:'hq',direction:'transfer',software:'Office',type:'multi',qty:3,items:[{lot:'L-east',key:'K1',qty:3}],status:'pending',created:'2026-11-02 09:00:00',finished:'',reason:'分机构向总机构拨出示例',operator:'华东管理员'},{id:'TR-DEMO-IN-SOUTH',from:'hq',to:'south',direction:'transfer',software:'Office',type:'multi',qty:4,items:[{lot:'L-K2',key:'K2',qty:4}],status:'pending',created:'2026-11-02 09:05:00',finished:'',reason:'总机构向分机构拨出示例',operator:'总机构管理员'});
 S.transfers.forEach(t=>{t.fromName=warehouse(t.from).name;t.toName=warehouse(t.to).name});actor='hq';view='warehouses';tab='balance';search='';pageIndex=1;keyFilter=null;lastTransferHint=null;extendSeed();assertState();
}
const pending=()=>S.transfers.filter(t=>t.status==='pending');
const activeBindings=()=>S.bindings.filter(b=>b.active);
const usedLot=id=>activeBindings().filter(b=>b.lot===id).length;
const reservedLot=(id,exclude)=>pending().filter(t=>t.id!==exclude).flatMap(t=>t.items).filter(i=>i.lot===id).reduce((n,i)=>n+i.qty,0);
const freeLot=(l,exclude)=>l.qty-usedLot(l.id)-reservedLot(l.id,exclude);
const held=(k,o)=>S.lots.filter(l=>l.key===k&&l.warehouse===o).reduce((n,l)=>n+l.qty,0);
const visibleKeys=o=>S.keys.filter(k=>!k.deleted&&held(k.id,o)>0);
function metrics(software,type,o=actor){const ks=visibleKeys(o).filter(k=>(!software||k.software===software)&&(!type||k.type===type));const ids=new Set(ks.map(k=>k.id));const h=ks.reduce((n,k)=>n+held(k.id,o),0),u=activeBindings().filter(b=>b.warehouse===o&&ids.has(b.key)).length,x=pending().filter(t=>t.from===o).flatMap(t=>t.items).filter(i=>ids.has(i.key)).reduce((n,i)=>n+i.qty,0);return {held:h,used:u,stock:h-u,transit:x,available:h-u-x};}
function isDescendant(child,parent){let c=warehouse(child),seen=new Set();while(c&&c.parent){if(seen.has(c.id))return false;seen.add(c.id);if(c.parent===parent)return true;c=warehouse(c.parent)}return false;}
function requireActive(o){if(!warehouse(o)||warehouse(o).status!=='active')throw Error('机构不存在或已停用。');}
function quantity(n){if(!Number.isSafeInteger(n)||n<1)throw Error('数量必须为正整数。');return n;}
function assertState(){
 if(S.contracts&&new Set(S.contracts.map(c=>c.id)).size!==S.contracts.length)throw Error('合同隐藏标识重复。');
 for(const l of S.lots){if(!Number.isSafeInteger(l.qty)||l.qty<0||freeLot(l)<0)throw Error('库存一致性校验失败。');if(l.parent&&(!lot(l.parent)||lot(l.parent).key!==l.key||l.parent===l.id))throw Error('份额来源链无效。');}
 for(const k of S.keys){const h=S.lots.filter(l=>l.key===k.id).reduce((n,l)=>n+l.qty,0);if(h!==(k.deleted?0:k.max))throw Error('全机构持有容量不守恒。');if(k.type==='single'&&k.max!==1)throw Error('单设备密钥容量必须为1。');}
 const pairs=activeBindings().map(b=>b.key+'|'+b.device);if(new Set(pairs).size!==pairs.length)throw Error('同一密钥与设备不能重复绑定。');
 for(const b of activeBindings()){const l=lot(b.lot);if(!l||l.key!==b.key||l.warehouse!==b.warehouse||!S.installs.some(i=>i.id===b.install))throw Error('设备绑定来源无效。');}
 if(S.contractKeys){const pairs=S.contractKeys.map(r=>r.contract+'|'+r.key);if(new Set(pairs).size!==pairs.length)throw Error('合同—密钥重复关联。');for(const r of S.contractKeys)if(!contract(r.contract)||!key(r.key)||key(r.key).deleted)throw Error('合同—密钥关联无效。');}
 if(S.operations)for(const r of S.operations){const b=S.bindings.find(b=>b.id===r.binding);if(!b)throw Error('操作记录绑定不存在。');if(r.way==='安装'&&((r.status==='使用中')!==b.active))throw Error('安装记录与绑定状态不一致。');if(r.way==='回收'&&(!S.operations.some(i=>i.id===r.source&&i.binding===r.binding)||b.active))throw Error('回收未对应原安装。');}
 for(const t of pending())if(t.items.reduce((n,i)=>n+i.qty,0)!==t.qty)throw Error('调拨预占不完整。');
}
function transaction(action,fn){const snapshot=JSON.stringify(S),oldUid=uid;try{const result=fn();assertState();S.audit.push({id:nextId('AU'),time:now(),actor,action});return result}catch(e){S=JSON.parse(snapshot);uid=oldUid;throw e;}}
function candidateLots(k,o,target,direction){return S.lots.filter(l=>l.key===k&&l.warehouse===o&&freeLot(l)>0).sort((a,b)=>a.id.localeCompare(b.id));}
function planRequest({software,type,qty,devices=[],target=null,direction=null,o=actor}){
 requireActive(o);quantity(qty);if(!softwareOptions.includes(software)||!['single','multi'].includes(type))throw Error('软件或密钥类型无效。');
 if(devices.length){if(new Set(devices).size!==devices.length||devices.length!==qty)throw Error('选择的设备必须去重且数量恰好等于安装数量。');if(devices.some(d=>!device(d)||device(d).status!=='active'))throw Error('只能新增安装到有效设备。');}
 if(direction){requireActive(target);if(target===o)throw Error('拨出与拨入机构不能相同。');}

 const ks=visibleKeys(o).filter(k=>k.software===software&&k.type===type).sort((a,b)=>a.created-b.created||a.id.localeCompare(b.id));
 const eligible=k=>!devices.length||devices.every(d=>!activeBindings().some(b=>b.key===k.id&&b.device===d));
 if(type==='multi'){
  for(const k of ks){if(!eligible(k))continue;const ls=candidateLots(k.id,o,target,direction);if(ls.reduce((n,l)=>n+freeLot(l),0)<qty)continue;let remaining=qty;const items=[];for(const l of ls){const q=Math.min(remaining,freeLot(l));if(q){items.push({lot:l.id,key:k.id,qty:q});remaining-=q}if(!remaining)break;}return items;}
  throw Error('没有单个多设备密钥能完整满足本次数量及设备/来源条件；不能拼接其他密钥。');
 }
 const chosen=ks.filter(k=>candidateLots(k.id,o,target,direction).some(l=>freeLot(l)>=1));
 if(chosen.length<qty)throw Error('符合条件的单设备密钥数量不足。');
 // 当前单设备实例总容量为1，因此有空闲份额的实例不可能存在任何有效绑定。
 return chosen.slice(0,qty).map(k=>({lot:candidateLots(k.id,o,target,direction)[0].id,key:k.id,qty:1}));
}
function validateNew(data){
 if(!String(data.code||'').trim()||!String(data.name||'').trim())throw Error('必填项不能为空');
 if(!softwareOptions.includes(data.software)||!['single','multi'].includes(data.type))throw Error('软件或密钥类型无效。');quantity(data.max);if(data.type==='single'&&data.max!==1)throw Error('单设备密钥容量必须为1。');
 validateModelFields('key',data);if(S.fieldRules.key.unique&&S.keys.some(k=>!k.deleted&&k.code===data.code.trim()))throw Error('密钥编号重复（当前演示采用默认唯一配置）。');
}
function createKey(data){requireActive(actor);return transaction('新增密钥',()=>{validateNew(data);const id=nextId('KEY');S.keys.push({id,code:data.code.trim(),name:data.name.trim(),software:data.software,type:data.type,max:data.max,serial:data.serial||'',date:data.date||'',created:uid,createdWarehouse:actor,deleted:false,extra:{...(data.extra||{})}});S.lots.push({id:nextId('LT'),key:id,warehouse:actor,qty:data.max,parent:null});return id;});}
function editableKey(id){const k=key(id);if(!k||k.deleted||held(id,actor)<=0)throw Error('密钥不在当前机构持有范围。');return k;}
function editKey(id,data){return transaction('编辑密钥',()=>{const k=editableKey(id);data=Object.fromEntries(Object.entries(data).filter(([,v])=>v!==undefined));validateModelFields('key',{...k,...data,extra:{...k.extra,...data.extra}},id);for(const f of ['max','software','type','serial'])if(data[f]!==undefined&&data[f]!==k[f])throw Error('最大容量、软件类型、密钥类型和序列号创建后不可修改。');if(data.code!==undefined){if(!data.code.trim())throw Error('必填项不能为空');if(S.fieldRules.key.unique&&S.keys.some(x=>!x.deleted&&x.id!==id&&x.code===data.code.trim()))throw Error('密钥编号重复。');k.code=data.code.trim()}if(data.name!==undefined){if(!data.name.trim())throw Error('必填项不能为空');k.name=data.name.trim()}if(data.date!==undefined)k.date=data.date;if(data.extra!==undefined)k.extra={...k.extra,...data.extra};return k;});}
function deleteKey(id){return transaction('删除密钥',()=>{const k=editableKey(id);if(S.contractKeys.some(r=>r.key===id))throw Error('该密钥仍关联合同，请先解除关联。');if(activeBindings().some(b=>b.key===id))throw Error('该密钥存在设备绑定，请先回收。');if(pending().some(t=>t.items.some(i=>i.key===id)))throw Error('该密钥存在在途调拨，请先完成或终止。');if(S.lots.some(l=>l.key===id&&l.warehouse!==actor&&l.qty>0))throw Error('其他机构仍持有份额，不能删除共同密钥。');for(const l of S.lots.filter(l=>l.key===id))l.qty=0;k.deleted=true;S.attachments=S.attachments.filter(a=>!(a.kind==='key'&&a.owner===id));});}
function warehouseBusy(id){return S.lots.some(l=>l.warehouse===id&&l.qty>0)||activeBindings().some(b=>b.warehouse===id)||pending().some(t=>t.from===id||t.to===id)||S.warehouses.some(o=>o.parent===id&&o.status!=='deleted');}
function createWarehouse(name,parent,manager){return transaction('新增机构',()=>{if(!name.trim()||!manager.trim())throw Error('必填项不能为空');if(parent!=='hq')throw Error('只支持总机构＋分机构二级结构，新增机构固定属于总机构。');requireActive('hq');const id=nextId('WH');S.warehouses.push({id,name:name.trim(),parent:'hq',manager:manager.trim(),status:'active'});return id;});}
function updateWarehouse(id,name,manager){return transaction('编辑机构',()=>{requireActive(id);if(!name.trim()||!manager.trim())throw Error('必填项不能为空');warehouse(id).name=name.trim();warehouse(id).manager=manager.trim();});}
function exitWarehouse(id,mode){return transaction(mode==='delete'?'删除机构':'停用机构',()=>{if(!warehouse(id)||warehouse(id).status==='deleted')throw Error('机构不存在。');if(!warehouse(id).parent)throw Error('根机构作为演示入口保留。');if(warehouseBusy(id))throw Error('机构仍有库存、占用、待接收调拨或未删除下级机构，不能停用或删除。');warehouse(id).status=mode==='delete'?'deleted':'inactive';});}
function importRows(rows,mode){
 const results=[];for(let i=0;i<rows.length;i++){const data=rows[i];try{if(!data||typeof data!=='object'||Array.isArray(data)||Object.keys(data).some(f=>!['code','name','software','type','max','serial','date','extra'].includes(f)))throw Error('仅允许密钥主数据字段，不能导入绑定、调拨或库存。');if(mode==='new'){createKey({...data,max:Number(data.max)});}else{const matches=visibleKeys(actor).filter(k=>k.code===data.code);if(matches.length!==1)throw Error('当前机构内没有唯一匹配的密钥编号。');const changes={name:data.name,date:data.date,...(data.extra?{extra:data.extra}:{})};for(const f of ['max','software','type','serial'])if(Object.hasOwn(data,f))changes[f]=f==='max'?Number(data[f]):data[f];editKey(matches[0].id,changes);}results.push({row:i+2,ok:true,message:'成功'})}catch(e){results.push({row:i+2,ok:false,message:e.message})}}
 return results;
}

function planManual(software,keyIds,deviceIds,allowInvalid=false){
 requireActive(actor);if(!softwareOptions.includes(software))throw Error('软件无效。');
 const ids=[...new Set(keyIds)],ds=[...new Set(deviceIds)];if(!ids.length||!ds.length)throw Error('必填项不能为空');
 const ks=ids.map(id=>editableKey(id)).sort((a,b)=>a.created-b.created||a.id.localeCompare(b.id));
 if(ks.some(k=>k.software!==software||keyFree(k.id)<=0))throw Error('所选密钥已不可用或软件不一致，请重新选择。');
 if(ds.some(id=>!device(id)||(!allowInvalid&&device(id).status!=='active')))throw Error('只能新增安装到有效设备。');
 // 二分匹配：避免简单贪心被既有密钥—设备绑定阻塞，匹配仅限手选范围。
 const slots=ks.flatMap(k=>Array.from({length:Math.min(keyFree(k.id),ds.length)},()=>k.id));
 if(slots.length<ds.length)throw Error('所选密钥可用名额不足，无法覆盖全部设备。');
 const owner=Array(slots.length).fill(-1);
 function match(di,seen){for(let si=0;si<slots.length;si++){if(seen.has(si)||activeBindings().some(b=>b.key===slots[si]&&b.device===ds[di]))continue;seen.add(si);if(owner[si]<0||match(owner[si],seen)){owner[si]=di;return true}}return false}
 for(let di=0;di<ds.length;di++)if(!match(di,new Set()))throw Error('所选范围无法完成全部设备匹配，请调整密钥或设备。');
 const result=ds.map(d=>({device:d})),used={};
 owner.forEach((di,si)=>{if(di<0)return;const kid=slots[si];const l=S.lots.find(l=>l.key===kid&&l.warehouse===actor&&freeLot(l)>(used[l.id]||0));if(!l)throw Error('可用份额变化，请重试。');used[l.id]=(used[l.id]||0)+1;result[di]={device:ds[di],key:kid,lot:l.id}});return result;
}
function installManual(software,keyIds,deviceIds,meta,allowInvalid=false){const m=businessMeta(meta);return transaction('安装',()=>{
 const assignments=planManual(software,keyIds,deviceIds,allowInvalid),batch=nextId('IN');
 S.installs.unshift({id:batch,warehouse:actor,warehouseName:warehouse(actor).name,software,qty:assignments.length,time:now(),...m});
 for(const a of assignments){const rid=nextId('IS'),bid=nextId('BD'),d=device(a.device),k=key(a.key);
 S.bindings.push({id:bid,install:batch,record:rid,warehouse:actor,key:a.key,lot:a.lot,device:a.device,keyCode:k.code,deviceName:d.name,active:true,installedAt:now(),recoveredAt:null});
 S.operations.unshift({id:rid,batch,warehouse:actor,way:'安装',source:null,binding:bid,software,key:a.key,keyCode:k.code,device:d.id,deviceName:d.name,status:'使用中',time:now(),auditOperator:currentUser(),...m});
 }return batch;
})}
function recoverRecords(recordIds,meta){const m=businessMeta(meta);return transaction('回收',()=>{
 if(!recordIds.length)throw Error('必填项不能为空');const rs=[...new Set(recordIds)].map(id=>S.operations.find(r=>r.id===id));
 if(rs.some(r=>!r||r.warehouse!==actor||r.way!=='安装'))throw Error('无当前机构安装记录的回收权限。');
 if(rs.some(r=>r.status!=='使用中'||!S.bindings.find(b=>b.id===r.binding)?.active))throw Error('安装已回收，请查看对应回收记录。');
 const batch=nextId('RB');for(const r of rs){const b=S.bindings.find(b=>b.id===r.binding);b.active=false;b.recoveredAt=now();b.recoveryId=nextId('RE');r.status='已回收';
 S.operations.unshift({id:b.recoveryId,batch,warehouse:actor,way:'回收',source:r.id,binding:b.id,software:r.software,key:r.key,keyCode:r.keyCode,device:r.device,deviceName:r.deviceName,status:'已完成',time:now(),auditOperator:currentUser(),...m});}return rs.length;
})}
function sendTransfer(software,type,qty,target,meta){const m=businessMeta(meta);return transaction('发起调拨',()=>{const items=planRequest({software,type,qty,target,direction:'transfer'});const t={id:nextId('TR'),from:actor,to:target,direction:'transfer',software,type,qty,items,fromName:warehouse(actor).name,toName:warehouse(target).name,status:'pending',created:now(),finished:'',reason:'',receiver:'',receivedDate:'',auditOperator:currentUser(),...m};S.transfers.unshift(t);return t.id;});}
function finishTransfer(id,action,reason='',receive={}){return transaction('调拨'+action,()=>{
 const t=S.transfers.find(x=>x.id===id);if(!t)throw Error('调拨单不存在。');if(t.status!=='pending')throw Error('调拨单已处理，请刷新查看结果。');if(!['accept','reject','cancel'].includes(action))throw Error('操作无效。');if(action==='cancel'?t.from!==actor:t.to!==actor)throw Error('无此调拨单的处理权限。');requireActive(t.from);requireActive(t.to);
 if(action==='accept'){const receiver=required(receive.receiver),date=validDate(receive.date);for(const item of t.items){const l=lot(item.lot);if(!l||l.warehouse!==t.from||freeLot(l,t.id)<item.qty)throw Error('预占发生异常，库存未变动。');l.qty-=item.qty;S.lots.push({id:nextId('LT'),key:item.key,warehouse:t.to,qty:item.qty,parent:l.id});}t.receiver=receiver;t.receivedDate=date;}
 t.status={accept:'accepted',reject:'rejected',cancel:'cancelled'}[action];t.finished=now();t.processor=currentUser();t.reason=reason;return t;
})}
function saveContract(id,data){data=Object.fromEntries(Object.entries(data).filter(([name])=>['code','name','status','start','end','owner','supplier','amount','remark','extra'].includes(name)));return transaction(id?'编辑合同':'新增合同',()=>{
 validateModelFields('contract',{...contract(id),...data},id);const code=required(data.code),name=required(data.name);if(S.fieldRules.contract.unique&&S.contracts.some(c=>!c.deleted&&c.id!==id&&c.code===code))throw Error('合同编号重复。');
 if(!['草稿','生效中','已到期','已终止'].includes(data.status))throw Error('合同状态无效。');if(data.start)validDate(data.start);if(data.end)validDate(data.end);if(data.start&&data.end&&data.end<data.start)throw Error('结束日期不得早于开始日期。');if(data.amount&&!/^\d+(\.\d{1,2})?$/.test(data.amount))throw Error('金额须为非负数，最多两位小数。');
 const c=id?contract(id):{id:nextId('CT'),created:now(),deleted:false};if(!c)throw Error('合同不存在。');Object.assign(c,data,{code,name,updated:now()});if(!id)S.contracts.unshift(c);return c.id;
})}
function addContractKeys(keyIds,contractIds){return transaction('关联合同',()=>{
 const ks=[...new Set(keyIds)],cs=[...new Set(contractIds)];if(!ks.length||!cs.length)throw Error('必填项不能为空');ks.forEach(editableKey);if(cs.some(id=>!contract(id)))throw Error('合同已删除或不可用。');let added=0,skipped=0;
 for(const kid of ks)for(const cid of cs){if(S.contractKeys.some(r=>r.key===kid&&r.contract===cid)){skipped++;continue}S.contractKeys.push({key:kid,contract:cid});added++}return {added,skipped};
})}
function removeContractKey(cid,kid){return transaction('解除合同—密钥关联',()=>{editableKey(kid);if(!contract(cid))throw Error('合同不存在。');S.contractKeys=S.contractKeys.filter(r=>r.key!==kid||r.contract!==cid)})}
function addContractDevices(cid,ids){return transaction('关联设备',()=>{if(!contract(cid))throw Error('合同不存在。');if(!ids.length)throw Error('必填项不能为空');if(ids.some(id=>!device(id)||device(id).status==='deleted'))throw Error('所选设备已删除。');let added=0;for(const id of new Set(ids))if(!S.contractDevices.some(r=>r.contract===cid&&r.device===id)){S.contractDevices.push({contract:cid,device:id});added++}return added})}
function deleteContract(id){return transaction('删除合同',()=>{const c=contract(id);if(!c)throw Error('合同不存在。');if(S.contractKeys.some(r=>r.contract===id)||S.contractDevices.some(r=>r.contract===id))throw Error('合同仍有关联设备或密钥，请先解除全部关联。');c.deleted=true;S.attachments=S.attachments.filter(a=>!(a.kind==='contract'&&a.owner===id));})}

// V14：恢复原有独立字段管理页面；字段配置与业务主数据共用内存模型。
const fieldTypes={text:'短字符',longtext:'长字符',integer:'整数',money:'金额',date:'日期',enum:'数据字典下拉',user:'用户引用'};
const builtinFields={
 contract:[{id:'contract_id',prop:'code',name:'合同编号',type:'text',required:true,numberRule:true},{id:'contract_name',prop:'name',name:'合同名称',type:'text',required:true},{id:'status',prop:'status',name:'合同状态',type:'enum',required:true,dictionary:['草稿','生效中','已到期','已终止'],constraint:'默认草稿；手工维护'},{id:'start_date',prop:'start',name:'开始日期',type:'date'},{id:'end_date',prop:'end',name:'结束日期',type:'date',constraint:'不得早于开始日期'},{id:'owner_id',prop:'owner',name:'负责人',type:'user'},{id:'remark',prop:'remark',name:'备注',type:'longtext'}],
 key:[{id:'license_id',prop:'code',name:'密钥编号',type:'text',required:true,numberRule:true},{id:'license_name',prop:'name',name:'名称',type:'text',required:true},{id:'software_type_id',prop:'software',name:'软件名称',type:'enum',required:true,dictionary:softwareOptions,locked:true,constraint:'软件数据字典；创建后锁定'},{id:'license_type',prop:'type',name:'密钥类型',type:'enum',required:true,dictionary:['single','multi'],locked:true,constraint:'单设备/多设备；创建后锁定'},{id:'total_quantity',prop:'max',name:'最大容量',type:'integer',required:true,locked:true,constraint:'正整数；单设备固定1；创建后锁定'},{id:'license_key',prop:'serial',name:'序列号',type:'text',locked:true,constraint:'允许重复；创建后锁定'},{id:'expiration_date',prop:'date',name:'有效时间',type:'date',constraint:'人工维护，不触发到期逻辑'}]
};
function initFieldManagement(){
 S.fieldRules={key:{unique:true,regex:'',maxLength:64},contract:{unique:true,regex:'',maxLength:64}};
 S.contractFields=[{id:'contract_amount',prop:'amount',name:'合同金额',type:'money',active:true,required:false,unique:false,regex:'',maxLength:null},{id:'supplier',prop:'supplier',name:'供应商',type:'enum',active:true,required:false,unique:false,regex:'',dictionary:['办公软件供应商','设计软件供应商','设备供应商'],maxLength:null}];
 S.keyFields=[{id:'edition',name:'版本',type:'text',active:true,required:false,unique:false,regex:'',maxLength:64}];
 for(const k of S.keys)k.extra={edition:k.software==='Office'?'企业版':''};
}
const customFields=kind=>(kind==='contract'?S.contractFields:S.keyFields).filter(f=>!f.deleted);
const modelFields=kind=>[...builtinFields[kind].map(f=>({...f,builtin:true,active:true})),...customFields(kind)];
const valueOfField=(obj,f)=>f.prop?obj[f.prop]:obj.extra?.[f.id];
const modelRecords=kind=>kind==='contract'?S.contracts:S.keys;
const hasValue=v=>v!==''&&v!==null&&v!==undefined;
function validateModelFields(kind,data,id){
 const rules=S.fieldRules?.[kind];if(!rules)return;if(data.extra&&(typeof data.extra!=='object'||Array.isArray(data.extra)||Object.keys(data.extra).some(id=>!customFields(kind).some(f=>f.id===id&&!f.prop))))throw Error('自定义字段数据无效。');
 for(const f of modelFields(kind).filter(f=>f.active)){
  const v=valueOfField(data,f),r=f.numberRule?rules:f;
  if(f.required&&(!hasValue(v)||(typeof v==='string'&&!v.trim())))throw Error(f.name+'：必填项不能为空');
  if(!hasValue(v))continue;const text=String(v);
  if(r.maxLength&&text.length>r.maxLength)throw Error(f.name+'超过最大长度 '+r.maxLength+'。');
  if(r.regex&&!new RegExp(r.regex).test(text))throw Error(f.name+'不符合正则校验。');
  if(r.unique&&modelRecords(kind).some(o=>!o.deleted&&o.id!==id&&String(valueOfField(o,f)??'')===text))throw Error(f.name+'重复。');
  if(f.type==='integer'&&!/^-?\d+$/.test(text))throw Error(f.name+'必须为整数。');
  if(f.type==='money'&&!/^\d+(\.\d{1,2})?$/.test(text))throw Error(f.name+'须为非负金额，最多两位小数。');
  if(f.type==='date')validDate(text);
  if(f.type==='enum'&&f.dictionary&&!f.dictionary.includes(v))throw Error(f.name+'不在数据字典选项内。');
 }
}
function saveCustomField(kind,id,data){return transaction('保存字段配置',()=>{
 const existing=id?customFields(kind).find(f=>f.id===id):null;if(id&&!existing)throw Error('字段不存在。');
 const name=required(data.name),identifier=existing?.id||required(data.id);
 if(!/^[a-z][a-z0-9_]*$/.test(identifier))throw Error('字段标识须使用英文小写字母、数字和下划线，且以字母开头。');
 const storageNames=new Set(['id','extra','deleted','created_at','updated_at','created_by','updated_by','is_deleted','constructor','prototype',...modelFields(kind).map(f=>f.prop).filter(Boolean),...modelRecords(kind).flatMap(o=>Object.keys(o))]);if(!existing&&storageNames.has(identifier))throw Error('该标识由系统保留。');
 if(modelFields(kind).some(f=>f.id!==id&&(f.id===identifier||f.name===name)))throw Error('字段名称或标识重复。');
 if((kind==='contract'?S.contractFields:S.keyFields).some(f=>f.deleted&&f.id===identifier))throw Error('该字段标识已归档，请使用其他标识。');
 const type=existing?.type||data.type;if(!['text','longtext','integer','money','date','enum'].includes(type))throw Error('字段类型无效。');
 if(data.regex)try{new RegExp(data.regex)}catch(e){throw Error('正则表达式格式有误。')}
 const maxLength=data.maxLength===''||data.maxLength==null?null:Number(data.maxLength);if(maxLength!==null&&(!Number.isSafeInteger(maxLength)||maxLength<1))throw Error('最大长度须为正整数。');
 const dictionary=type==='enum'?[...new Set((data.dictionary||[]).map(v=>v.trim()).filter(Boolean))]:undefined;if(type==='enum'&&!dictionary.length)throw Error('数据字典选项不能为空。');
 const f={...(existing||{}),id:identifier,name,type,required:!!data.required,unique:!!data.unique,regex:data.regex||'',maxLength,active:existing?existing.active:true,dictionary};
 // 已有数据可保留，后续保存按新规则校验；不能移除仍被使用的字典值。
 if(existing&&type==='enum'&&modelRecords(kind).some(o=>!o.deleted&&hasValue(valueOfField(o,existing))&&!dictionary.includes(valueOfField(o,existing))))throw Error('仍有数据使用被移除的字典选项，请保留该选项。');
 if(f.unique){const values=modelRecords(kind).filter(o=>!o.deleted).map(o=>valueOfField(o,f)).filter(hasValue).map(String);if(new Set(values).size!==values.length)throw Error('现有字段值重复，无法启用唯一校验。');}if(existing)Object.assign(existing,f);else {const fs=kind==='contract'?S.contractFields:S.keyFields;fs.push(f);if(kind==='contract')S.contractColumns.push(identifier)}return identifier;
})}
function toggleCustomField(kind,id){return transaction('启停字段',()=>{const f=customFields(kind).find(f=>f.id===id);if(!f)throw Error('内置字段不可停用。');f.active=!f.active;return f.active})}
function deleteCustomField(kind,id){return transaction('删除字段',()=>{const f=customFields(kind).find(f=>f.id===id);if(!f)throw Error('内置字段不可删除。');if(modelRecords(kind).some(o=>hasValue(valueOfField(o,f))))throw Error('字段仍有数据，请先处理数据；可停用并保留原值。');f.deleted=true;if(kind==='contract')S.contractColumns=S.contractColumns.filter(x=>x!==(f.prop||f.id));})}
function saveNumberRule(kind,data){return transaction('配置编号校验',()=>{if(data.regex)try{new RegExp(data.regex)}catch(e){throw Error('正则表达式格式有误。')}const n=Number(data.maxLength);if(!Number.isSafeInteger(n)||n<1)throw Error('最大长度须为正整数。');if(data.unique){const codes=modelRecords(kind).filter(o=>!o.deleted).map(o=>o.code);if(new Set(codes).size!==codes.length)throw Error('现有编号重复，无法启用唯一校验。');}S.fieldRules[kind]={unique:!!data.unique,regex:data.regex||'',maxLength:n};})}

function updatePickerCount(){const p=pickerState;if(!p)return;const cap=p.kind==='key'&&p.purpose==='install'?' · 可用名额 '+[...p.selected].reduce((n,id)=>n+keyFree(id),0):'';$('picker-count').textContent='已选择 '+p.selected.size+' 条'+cap;$('picker-add').disabled=!p.selected.size&&!(p.purpose==='install'&&p.initialCount>0);$('picker-add').textContent=!p.selected.size&&p.purpose==='install'&&p.initialCount>0?'确定选择':'添加已选';$('picker-add').hidden=!p.searched;$('picker-clear').hidden=!p.selected.size;}
function pickerToggle(id,checked){if(pickerDisabled(id))return;checked?pickerState.selected.add(id):pickerState.selected.delete(id);const boxes=[...document.querySelectorAll('[name=picker-choice]:not(:disabled)')],n=boxes.filter(e=>e.checked).length;const h=$('picker-page-all');if(h){h.checked=!!boxes.length&&n===boxes.length;h.indeterminate=n>0&&n<boxes.length}updatePickerCount()}
function pickerSelectPage(checked){document.querySelectorAll('[name=picker-choice]:not(:disabled)').forEach(e=>{e.checked=checked;checked?pickerState.selected.add(e.value):pickerState.selected.delete(e.value)});renderPickerResults()}
function pickerPage(n){const total=filteredPickerRows(pickerState).length,pages=Math.max(1,Math.ceil(total/pickerState.limit));pickerState.page=Math.max(1,Math.min(pages,n));renderPickerResults()}
function pickerLimit(n){pickerState.limit=n;pickerState.page=1;renderPickerResults()}
function clearPickerSelection(){pickerState.selected.clear();if(pickerState.purpose==='install')pickerState.searched=true;renderPickerResults()}
function cancelPicker(){$('selector-dialog').close();pickerState=null}
function confirmPicker(){const p=pickerState;if(!p||(!p.selected.size&&!(p.purpose==='install'&&p.initialCount>0)))return;try{const candidates=new Set(pickerCandidates(p).map(o=>o.id));const ids=[...p.selected];if(ids.some(id=>!candidates.has(id)||pickerDisabled(id)))throw Error('部分选择已不在当前候选范围，请重新选择。');const message=p.onConfirm(ids);$('selector-dialog').close();pickerState=null;if(message)toast(message)}catch(e){$('picker-error').textContent=e.message;$('picker-error').focus()}}
function installDialog(software=''){const ss=softwareOptions.filter(s=>visibleKeys(actor).some(k=>k.software===s&&keyFree(k.id)>0));if(!ss.length)return toast('本机构暂无可用软件密钥。');const chosen=ss.includes(software)?software:ss[0];installDraft={software:chosen,keys:[],devices:[]};
 modal('安装',metaFields('in','安装')+readonly('安装记录','--')+field('软件名称 *','<select id="in-software" onchange="changeInstallSoftware()">'+options(ss,chosen)+'</select>')+'<div class="selection-panel"><div class="toolbar"><strong>密钥信息 <span class="required">*</span></strong><span id="install-key-count" class="hint"></span><span class="spacer"></span>'+button('选择密钥',"chooseInstallObjects('key')")+'</div><div id="install-key-summary"></div></div><div class="selection-panel"><div class="toolbar"><strong>安装设备 <span class="required">*</span></strong><span id="install-device-count" class="hint"></span><span class="spacer"></span>'+button('选择设备',"chooseInstallObjects('device')")+'</div><div id="install-device-summary"></div></div>'+field('备注','<textarea id="in-remark" rows="2"></textarea>')+'<div class="toolbar">'+button('预览系统匹配','previewInstall()')+'<span class="hint">安装数量以设备数为准，无需逐台配对。</span></div><div id="install-preview"></div>',()=>{installManual($('in-software').value,installDraft.keys,installDraft.devices,readMeta('in'));installDraft=null;return '安装成功，已生成逐设备记录并同步库存。';});renderInstallSelection();
}
function changeInstallSoftware(){installDraft.software=$('in-software').value;installDraft.keys=[];renderInstallSelection();invalidateInstallPreview()}
function renderInstallSelection(){if(!installDraft)return;$('install-key-count').textContent='已选 '+installDraft.keys.length+' 把 · 可用名额 '+installDraft.keys.reduce((n,id)=>n+keyFree(id),0);$('install-device-count').textContent='已选 '+installDraft.devices.length+' 台';
 $('install-key-summary').innerHTML=installDraft.keys.length?table(['密钥编号','密钥类型','当前可分配','操作'],installDraft.keys.map(id=>[esc(key(id).code),typeLabel(key(id).type),keyFree(id),button('移除',"removeInstallSelection('key','"+id+"')",'link')])):'<div class="selection-placeholder">请选择密钥，可通过密钥字段搜索后勾选。</div>';
 $('install-device-summary').innerHTML=installDraft.devices.length?table(['设备唯一标识','设备名称','所属机构','操作'],installDraft.devices.map(id=>[esc(id),esc(device(id).name),esc(warehouse(device(id).warehouse)?.name||'--'),button('移除',"removeInstallSelection('device','"+id+"')",'link')])):'<div class="selection-placeholder">请选择设备，可选择全部资产范围并按字段检索。</div>';
}
function chooseInstallObjects(kind){openPicker(kind,{purpose:'install',software:installDraft.software,selected:kind==='key'?installDraft.keys:installDraft.devices,range:'候选范围：'+warehouse(actor).name+' / '+installDraft.software+' / 当前可分配密钥',onConfirm:ids=>{installDraft[kind==='key'?'keys':'devices']=ids;renderInstallSelection();invalidateInstallPreview();return ''}})}
function removeInstallSelection(kind,id){const prop=kind==='key'?'keys':'devices';installDraft[prop]=installDraft[prop].filter(x=>x!==id);renderInstallSelection();invalidateInstallPreview()}
function previewInstall(){try{const assignments=planManual($('in-software').value,installDraft.keys,installDraft.devices);$('install-preview').innerHTML=table(['安装设备','系统匹配密钥'],assignments.map(a=>[esc(a.device),esc(key(a.key).code)]));$('modal-error').textContent=''}catch(e){showError(e)}}
function contractObjectsDialog(cid,kind){if(!contract(cid))return toast('合同不存在。');openPicker(kind==='device'?'device':'key',{purpose:'contract',existing:(kind==='device'?S.contractDevices:S.contractKeys).filter(r=>r.contract===cid).map(r=>r[kind==='device'?'device':'key']),range:'候选范围：'+warehouse(actor).name+' / 当前可见密钥 / 合同关联',onConfirm:ids=>{const result=kind==='key'?addContractKeys(ids,[cid]):addContractDevices(cid,ids);render();return kind==='key'?'已新增 '+result.added+' 对合同关联。':'已新增 '+result+' 条设备关联。';}})}
function keyContractsDialog(ids){try{ids.forEach(editableKey)}catch(e){return toast(e.message)}openPicker('contract',{purpose:'keyContracts',range:'候选范围：可查看合同 / 将为 '+ids.length+' 条密钥追加关联 / 已有关系跳过',onConfirm:cids=>{const r=addContractKeys(ids,cids);selectedKeys.clear();render();return '关联完成：新增 '+r.added+' 对，已有 '+r.skipped+' 对已跳过。';}})}

$ ('selector-dialog').addEventListener('cancel',e=>{e.preventDefault();cancelPicker()});
seed();const entry=new URLSearchParams(location.hash.slice(1));const entryWarehouse=entry.get('warehouse'),entryTab=entry.get('tab');if(warehouse(entryWarehouse)?.status==='active'&&['balance','inbox','instances','installs','transfers'].includes(entryTab))enterWarehouse(entryWarehouse,entryTab);else if(entry.get('view')==='contracts'){go('contract')}else if(entry.get('view')==='keyFields'){openFields('key')}else if(entry.get('view')==='contractFields'){openFields('contract')}else render();

</script></body></html>
